name: Release

# Publishes a GitHub release (which HACS installs from) whenever main carries a
# package.json version that has no release yet. To release: bump "version" in
# package.json and push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Skip if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.v.outputs.tag }} already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - if: steps.check.outputs.exists == 'false'
        run: npm ci

      - if: steps.check.outputs.exists == 'false'
        run: npm run typecheck

      - if: steps.check.outputs.exists == 'false'
        run: npm run build

      - name: Check card banner version matches package.json
        if: steps.check.outputs.exists == 'false'
        run: |
          grep -q "${{ steps.v.outputs.tag }}" <(echo "v$(grep -oE "VERSION = '[^']+'" src/frigate-timeline-card.ts | cut -d"'" -f2)") \
            || { echo "src VERSION does not match package.json"; exit 1; }

      - name: Publish release with card bundle
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" dist/*.js \
            --target "$GITHUB_SHA" \
            --title "${{ steps.v.outputs.tag }}" \
            --generate-notes
